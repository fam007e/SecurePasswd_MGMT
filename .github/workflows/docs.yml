name: Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'Doxyfile'
      - 'scripts/build_docs.py'
      - 'docs/**'
      - 'README.md'
      - 'core/**'
      - 'gui/**'
      - 'cli/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doxygen, Graphviz, and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3

      - name: Build & Audit Documentation
        run: python3 scripts/build_docs.py

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api/html
          enable_jekyll: false

