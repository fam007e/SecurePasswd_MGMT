name: Request Signing

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Dispatch to OSSign (trusted workflow)
        id: dispatch
        uses: OSSign/actions/workflow/trusted-dispatch@43b42df3dc71718e98aca212ee366f56c98c1270
        with:
          dispatch_only: true
